name: Main container

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: main-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack CLI
        run: |
          npm pack --workspace @ai-outfitter/outfitter --pack-destination container/
          mv container/ai-outfitter-outfitter-*.tgz container/outfitter.tgz
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outfitter" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: container/
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=outfitter-main
          cache-to: type=gha,mode=max,scope=outfitter-main
      - name: Smoke test image
        run: docker run --rm "$IMAGE:latest" --version
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        run: |
          docker push "$IMAGE:latest"
