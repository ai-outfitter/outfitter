name: CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:

jobs:
  # Ubuntu runs the full CI gate; macOS runs the test suite.
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        if: matrix.os == 'ubuntu-latest'
        run: npm run check-ci

      - name: Run test suite
        if: matrix.os == 'macos-latest'
        run: npm test

  # Exercises the shipped artifact (npm pack → global install → run the bin) so
  # packaging regressions fail CI even when all in-process tests pass.
  packaged-smoke:
    name: Packaged E2E smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run packaged E2E smoke test
        run: bash scripts/e2e-smoke.sh
