name: Container

# One image pipeline for three entry points:
# - push to main: build, smoke test, and publish `latest` (only main moves latest)
# - release (workflow_call from release.yml): build, smoke test, and publish `<version>`
# - manual dispatch: reproduce a release image, optionally publishing `<version>`
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: Release version used for package metadata and the image tag
        required: true
        type: string
      publish:
        description: Push the validated version tag to GHCR
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version to reproduce
        required: true
        default: v1.0.1
        type: string
      publish:
        description: Push the validated version tag to GHCR
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # The published image. Debian-based so end users can extend it with an
  # ordinary Dockerfile (FROM + apt-get install / COPY).
  debian:
    name: Build and smoke test Debian image
    runs-on: ubuntu-latest
    # Serialize main pushes so `latest` is published in commit order; releases
    # and manual runs get their own group and never queue behind main.
    concurrency:
      group: container-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Main builds keep the committed CLI version so the --version smoke test
      # still has an exact expectation.
      - name: Resolve image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outfitter" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="$(jq -r .version code/cli/package.json)"
          else
            version="${VERSION_INPUT#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` keeps the image in the local daemon for the smoke tests;
      # publishing happens only after they pass. The revision label is applied
      # outside the Dockerfile so it does not bust cached layers.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          build-args: |
            RELEASE_VERSION=${{ inputs.version }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=outfitter-container
          cache-to: type=gha,mode=max,scope=outfitter-container

      - name: Smoke test image
        run: |
          set -euo pipefail
          output="$(docker run --rm "$IMAGE:$VERSION" --version)"
          if [ "$output" != "$VERSION" ]; then
            echo "Expected outfitter --version to print '$VERSION' but got '$output'." >&2
            exit 1
          fi
          docker run --rm --entrypoint /bin/sh "$IMAGE:$VERSION" -c '
            set -eu
            for command in node npm git ssh outfitter; do
              command -v "$command"
            done
            test -f /etc/ssl/certs/ca-certificates.crt
          '

      # Prove the extension workflow: install a tool, return to uid 1000, and
      # confirm that the entrypoint still works.
      - name: Smoke test derivative image
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cat > "$workdir/Dockerfile" <<DOCKERFILE
          FROM $IMAGE:$VERSION
          USER root
          RUN apt-get update \
            && apt-get install -y --no-install-recommends jq \
            && rm -rf /var/lib/apt/lists/*
          USER 1000
          DOCKERFILE
          docker build -t outfitter-derivative:smoke "$workdir"
          docker run --rm outfitter-derivative:smoke --version
          docker run --rm --entrypoint jq outfitter-derivative:smoke --version

      # A rerun of an older main push must not roll `latest` back.
      - name: Check main is still at this commit
        id: main-tip
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to $tip; skipping latest for stale $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' && steps.main-tip.outputs.current == 'true') || (github.event_name != 'push' && inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main never pushes the version tag: its package.json still carries the
      # last released version, and that tag belongs to the release image.
      - name: Push version tag
        if: github.event_name != 'push' && inputs.publish
        run: docker push "$IMAGE:$VERSION"

      - name: Push latest tag
        if: github.event_name == 'push' && steps.main-tip.outputs.current == 'true'
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
