name: Container

on:
  workflow_call:
    inputs:
      version:
        description: Release version used for package metadata and the image tag
        required: true
        type: string
      publish:
        description: Push the validated image to GHCR
        required: false
        default: false
        type: boolean
      prerelease:
        description: Do not update latest for prereleases
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version to reproduce
        required: true
        default: v1.0.1
        type: string
      publish:
        description: Push the validated image to GHCR
        required: false
        default: false
        type: boolean
      prerelease:
        description: Do not update latest
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # The published image. Debian-based so end users can extend it with an
  # ordinary Dockerfile (FROM + apt-get install / COPY).
  debian:
    name: Build and smoke test Debian image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Sync release version
        run: node scripts/sync-release-version.mjs "${{ inputs.version }}"

      - name: Resolve image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outfitter" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION_INPUT#v}" >> "$GITHUB_ENV"
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # The image installs outfitter from this tarball, not the npm registry,
      # so the build works for unreleased versions and in CI before publish.
      - name: Pack CLI workspace tarball
        run: |
          npm pack --workspace @ai-outfitter/outfitter --pack-destination container/
          mv container/ai-outfitter-outfitter-*.tgz container/outfitter.tgz

      - name: Build image
        run: docker build -t "$IMAGE:$VERSION" container/

      - name: Smoke test image
        run: |
          set -euo pipefail
          output="$(docker run --rm "$IMAGE:$VERSION" --version)"
          if [ "$output" != "$VERSION" ]; then
            echo "Expected outfitter --version to print '$VERSION' but got '$output'." >&2
            exit 1
          fi
          docker run --rm --entrypoint /bin/sh "$IMAGE:$VERSION" -c '
            set -eu
            for command in node npm git ssh outfitter; do
              command -v "$command"
            done
            test -f /etc/ssl/certs/ca-certificates.crt
          '

      # Prove the extension workflow: install a tool, return to uid 1000, and
      # confirm that the entrypoint still works.
      - name: Smoke test derivative image
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cat > "$workdir/Dockerfile" <<DOCKERFILE
          FROM $IMAGE:$VERSION
          USER root
          RUN apt-get update \
            && apt-get install -y --no-install-recommends jq \
            && rm -rf /var/lib/apt/lists/*
          USER 1000
          DOCKERFILE
          docker build -t outfitter-derivative:smoke "$workdir"
          docker run --rm outfitter-derivative:smoke --version
          docker run --rm --entrypoint jq outfitter-derivative:smoke --version

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version tag
        if: inputs.publish
        run: docker push "$IMAGE:$VERSION"

      - name: Push latest tag
        if: inputs.publish && !inputs.prerelease
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
